<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Swarm C2 (Design Mock)</title>

  <!-- Google Fonts - Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">

  <!-- Leaflet (online) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
    defer
  ></script>

  <link rel="stylesheet" href="./style.css?v=live-scene-relay-8" />
  <script src="./config.js" defer></script>
  <script src="./script.js?v=live-scene-relay-8" defer></script>
</head>

<body>
  <div id="app">
    <div id="map"></div>

    <!-- overlay canvas for drones + links -->
    <canvas id="overlay"></canvas>

    <!-- Dedicated host for the Leaflet layer picker (kept above everything) -->
    <div id="layerPickerHost" aria-hidden="true"></div>

    <!-- top-left timestamp -->
    <div class="timestamp">
      <div id="timeLine">10:30 AM</div>
      <div id="dateLine">OCT 28 2024</div>
    </div>

    <!-- left glass panel -->
    <aside class="panel left is-collapsed" data-collapsible="1">
      <div class="panel-blur"></div>
      <div class="panel-content">
        <div class="panel-top panel-top-center">
          <button class="panel-title" type="button" aria-expanded="false">Commands Sequence</button>
        </div>

        <div class="label">SEQUENCE</div>
        <div class="sequence-list" id="sequenceList"></div>
        <button class="sequence-add" id="sequenceAddBtn" type="button" aria-label="Add command">+</button>

        <div class="sequence-transport" aria-label="Sequence controls">
          <button class="seq-ctl" id="seqPlayBtn" type="button" aria-label="Play" data-state="play"></button>
        </div>
      </div>
    </aside>

    <!-- right glass panel -->
    <aside class="panel right" data-collapsible="1">
      <div class="panel-blur"></div>
      <div class="panel-content right-content">
        <div class="panel-top panel-top-center">
          <button class="panel-title" type="button" aria-expanded="true">Drones</button>
        </div>
        <section class="live-control-panel" id="liveControlPanel" aria-label="Live drone position controls">
          <div class="live-control-header">
            <div>
              <div class="live-kicker">USB SERIAL</div>
              <div class="live-state" id="liveSerialState">Disconnected</div>
            </div>
            <span class="live-state-dot" id="liveSerialDot" aria-hidden="true"></span>
          </div>
          <div class="live-control-grid">
            <label class="live-field">
              <span>Baud</span>
              <input id="liveSerialBaud" type="number" min="1" step="1" value="921600" inputmode="numeric" />
            </label>
            <button class="live-btn live-btn-primary" id="liveSerialOpenBtn" type="button">Open</button>
            <button class="live-btn" id="liveSerialCloseBtn" type="button" disabled>Close</button>
            <button class="live-btn live-danger-btn" id="liveResetSessionBtn" type="button" disabled>Reset</button>
          </div>
          <div class="live-diagnostic-row" aria-label="GC diagnostic log">
            <div class="live-diagnostic-count">
              <span>GC Log</span>
              <strong id="liveGcLogCount">0</strong>
            </div>
            <button class="live-btn" id="liveGcLogDownloadBtn" type="button" disabled>Download</button>
            <button class="live-btn" id="liveGcLogClearBtn" type="button" disabled>Clear</button>
          </div>
          <div class="live-relay-panel" aria-label="Live relay">
            <div class="live-relay-top live-relay-top-simple">
              <div class="live-relay-state">
                <span>Online Relay</span>
                <strong id="liveRelayState">Starting</strong>
              </div>
            </div>
          </div>
          <section class="live-debug-panel" id="liveDebugPanel" aria-label="Live debug tools" hidden>
            <div class="live-debug-head">
              <span>Debug</span>
              <strong id="liveDebugState">Idle</strong>
            </div>
            <div class="live-debug-grid">
              <button class="live-btn" id="liveDebugTeleGcStatusBtn" type="button">TeleGC Status</button>
              <button class="live-btn" id="liveDebugMaGcStatusBtn" type="button">MaGC Status</button>
              <button class="live-btn" id="liveDebugMaGcBindBtn" type="button">MaGC Bind</button>
              <button class="live-btn" id="liveDebugMaGcCancelBtn" type="button">Cancel Bind</button>
            </div>
            <div class="live-debug-head live-debug-head-secondary">
              <span>Drone USB</span>
              <strong id="liveDebugDroneState">Disconnected</strong>
            </div>
            <div class="live-debug-grid">
              <button class="live-btn" id="liveDebugDroneOpenBtn" type="button">Open Drone</button>
              <button class="live-btn" id="liveDebugDroneCloseBtn" type="button" disabled>Close Drone</button>
              <button class="live-btn" id="liveDebugDroneHoldBtn" type="button" disabled>Hold JOIN</button>
              <button class="live-btn" id="liveDebugDroneJoinBtn" type="button" disabled>JOIN Now</button>
              <button class="live-btn" id="liveDebugDroneRestartHoldBtn" type="button" disabled>Restart Hold</button>
              <button class="live-btn" id="liveDebugDronePauseBtn" type="button" disabled>Pause Telemetry</button>
              <button class="live-btn" id="liveDebugDroneRfLoss2Btn" type="button" disabled>RF Loss 2</button>
              <button class="live-btn" id="liveDebugDroneDelay20Btn" type="button" disabled>Delay 20ms</button>
              <button class="live-btn" id="liveDebugDroneDrop2Btn" type="button" disabled>Drop 2 Cycles</button>
              <button class="live-btn live-danger-btn" id="liveDebugDroneRebootHoldBtn" type="button" disabled>Reboot Hold</button>
            </div>
            <div class="live-debug-head live-debug-head-secondary">
              <span>Drone Wi-Fi</span>
              <strong id="liveDebugDroneWifiState">Idle</strong>
            </div>
            <div class="live-debug-wifi-row">
              <label class="live-field live-debug-wifi-host">
                <span>Host</span>
                <input id="liveDebugDroneWifiHost" type="text" value="simple-mesh-7.local" spellcheck="false" />
              </label>
              <button class="live-btn" id="liveDebugDroneWifiStatusBtn" type="button">Status</button>
            </div>
            <div class="live-debug-grid">
              <button class="live-btn" id="liveDebugDroneWifiHoldBtn" type="button">Hold JOIN</button>
              <button class="live-btn" id="liveDebugDroneWifiJoinBtn" type="button">JOIN Now</button>
              <button class="live-btn" id="liveDebugDroneWifiRestartHoldBtn" type="button">Restart Hold</button>
              <button class="live-btn" id="liveDebugDroneWifiPauseBtn" type="button">Pause Telemetry</button>
              <button class="live-btn" id="liveDebugDroneWifiRfLoss2Btn" type="button">RF Loss 2</button>
              <button class="live-btn" id="liveDebugDroneWifiDelay20Btn" type="button">Delay 20ms</button>
              <button class="live-btn" id="liveDebugDroneWifiDrop2Btn" type="button">Drop 2 Cycles</button>
              <button class="live-btn live-danger-btn" id="liveDebugDroneWifiRebootHoldBtn" type="button">Reboot Hold</button>
            </div>
            <pre class="live-debug-log" id="liveSerialDebug" aria-label="Recent debug log"></pre>
          </section>
        </section>
        <section class="live-gc-panel" id="liveGcStatus" aria-label="GC radio status"></section>
        <div class="status-list" id="statusList"></div>
      </div>
    </aside>

  </div>
</body>
</html>
